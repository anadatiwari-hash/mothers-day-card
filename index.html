<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Mother's Day ❤️</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Playfair+Display:ital@0;1&family=Lato:wght@300;400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --blush: #f7c5c5;
    --rose: #e8a0a0;
    --peach: #fde8d8;
    --cream: #fff8f3;
    --gold: #d4a054;
    --dusty: #c98c8c;
    --light-rose: #fce4e4;
    --glow: rgba(247,197,197,0.6);
  }

  html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: 'Lato', sans-serif;
  }

  #canvas-bg {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    background: radial-gradient(ellipse at 30% 20%, #fde8d8 0%, #f7c5c5 30%, #fce4e4 60%, #fff0f5 100%);
    z-index: 0;
  }

  /* Particle canvas */
  #particle-canvas {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none; z-index: 1;
  }

  /* Webcam (hidden, small) */
  #webcam {
    position: fixed; bottom: 20px; right: 20px;
    width: 140px; height: 105px;
    border-radius: 16px;
    border: 2px solid rgba(247,197,197,0.7);
    opacity: 0.7; z-index: 100;
    object-fit: cover;
    box-shadow: 0 4px 20px rgba(200,100,100,0.2);
  }

  #hand-canvas {
    position: fixed; bottom: 20px; right: 20px;
    width: 140px; height: 105px;
    border-radius: 16px;
    pointer-events: none; z-index: 101;
  }

  /* Intro text */
  #intro-text {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 10;
    transition: opacity 1.5s ease;
  }

  #intro-text .tagline {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 300;
    font-size: clamp(18px, 3vw, 32px);
    color: #9c5a5a;
    line-height: 1.6;
    letter-spacing: 0.03em;
    text-shadow: 0 2px 20px rgba(200,100,100,0.2);
  }

  /* Instruction */
  #instruction {
    position: fixed;
    bottom: 140px; left: 50%;
    transform: translateX(-50%);
    font-family: 'Lato', sans-serif;
    font-weight: 300;
    font-size: 13px;
    color: rgba(156, 90, 90, 0.8);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    z-index: 10;
    text-align: center;
    transition: opacity 1s ease;
  }

  /* Hearts container */
  #hearts-container {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 5;
  }

  .floating-heart {
    position: absolute;
    width: 90px; height: 90px;
    cursor: none;
    transition: transform 0.3s ease;
  }

  .heart-svg {
    width: 100%; height: 100%;
    filter: drop-shadow(0 0 18px rgba(232,160,160,0.8));
    animation: heartFloat 3s ease-in-out infinite;
    transition: all 0.3s ease;
  }

  .floating-heart.pinching .heart-svg {
    filter: drop-shadow(0 0 30px rgba(212,80,80,0.9));
    transform: scale(1.2);
  }

  @keyframes heartFloat {
    0%, 100% { transform: translateY(0px) rotate(-2deg); }
    50% { transform: translateY(-15px) rotate(2deg); }
  }

  /* Memory photos */
  .memory-photo {
    position: fixed;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 40px rgba(200,100,100,0.3);
    opacity: 0;
    transform: scale(0.3) rotate(5deg);
    transition: all 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 6;
    border: 3px solid rgba(255,255,255,0.8);
  }

  .memory-photo.visible {
    opacity: 1;
    transform: scale(1) rotate(0deg);
  }

  .memory-photo img {
    width: 100%; height: 100%;
    object-fit: cover;
  }

  .memory-photo::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 50%);
    pointer-events: none;
  }

  /* Final reveal */
  #final-reveal {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 20;
    opacity: 0;
    pointer-events: none;
    transition: opacity 2s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center, rgba(253,232,216,0.95) 0%, rgba(247,197,197,0.98) 60%, rgba(252,228,228,1) 100%);
  }

  #final-reveal.visible {
    opacity: 1;
    pointer-events: all;
  }

  #final-photo-container {
    position: relative;
    margin-bottom: 30px;
    animation: finalFloat 4s ease-in-out infinite;
  }

  @keyframes finalFloat {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-12px); }
  }

  #final-photo {
    width: min(300px, 65vw);
    height: min(400px, 80vw);
    object-fit: cover;
    border-radius: 20px;
    border: 4px solid rgba(255,255,255,0.9);
    box-shadow: 0 20px 80px rgba(200,100,100,0.4), 0 0 60px rgba(247,197,197,0.6);
  }

  #final-photo-container::before {
    content: '';
    position: absolute; inset: -15px;
    border-radius: 30px;
    background: radial-gradient(ellipse, rgba(247,197,197,0.4) 0%, transparent 70%);
    animation: pulse 3s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.5; }
    50% { transform: scale(1.05); opacity: 1; }
  }

  #final-text {
    text-align: center;
    z-index: 21;
  }

  #final-text .subtitle {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 300;
    font-size: clamp(16px, 2.5vw, 26px);
    color: #9c5a5a;
    line-height: 1.7;
    margin-bottom: 16px;
    letter-spacing: 0.02em;
    opacity: 0;
    transform: translateY(20px);
    transition: all 1.5s ease 0.5s;
  }

  #final-text .main-wish {
    font-family: 'Playfair Display', serif;
    font-size: clamp(22px, 4vw, 48px);
    color: #c25a5a;
    letter-spacing: 0.05em;
    opacity: 0;
    transform: translateY(20px);
    transition: all 1.5s ease 1.2s;
    text-shadow: 0 4px 30px rgba(200,100,100,0.3);
  }

  #final-reveal.visible #final-text .subtitle,
  #final-reveal.visible #final-text .main-wish {
    opacity: 1;
    transform: translateY(0);
  }

  /* Pinch indicator */
  #pinch-indicator {
    position: fixed;
    width: 40px; height: 40px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(232,160,160,0.9) 0%, rgba(247,197,197,0.5) 60%, transparent 100%);
    pointer-events: none;
    z-index: 50;
    transform: translate(-50%, -50%) scale(0);
    transition: transform 0.15s ease;
    display: none;
  }

  #pinch-indicator.active {
    transform: translate(-50%, -50%) scale(1);
  }

  /* Hearts opened counter */
  #progress-dots {
    position: fixed;
    bottom: 135px; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 8px;
    z-index: 10;
  }

  .progress-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: rgba(200,140,140,0.3);
    border: 1.5px solid rgba(200,140,140,0.5);
    transition: all 0.5s ease;
  }

  .progress-dot.filled {
    background: #d4706a;
    box-shadow: 0 0 8px rgba(212,112,106,0.6);
  }

  /* Heart collage */
  .collage-photo {
    position: fixed;
    border-radius: 10px;
    overflow: hidden;
    border: 2px solid rgba(255,255,255,0.8);
    box-shadow: 0 6px 30px rgba(200,100,100,0.25);
    transition: all 1.8s cubic-bezier(0.34, 1.2, 0.64, 1);
    z-index: 7;
  }

  #camera-status {
    position: fixed;
    top: 20px; left: 50%;
    transform: translateX(-50%);
    font-family: 'Lato', sans-serif;
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(156, 90, 90, 0.7);
    z-index: 100;
    transition: opacity 1s ease;
  }
  /* ── Photo Replace Panel ─────────────────────────────── */
  #edit-toggle {
    position: fixed; top: 16px; left: 16px;
    z-index: 200;
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1.5px solid rgba(200,140,140,0.45);
    background: rgba(255,248,243,0.72);
    backdrop-filter: blur(8px);
    color: #b06060;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    padding: 7px;
    box-shadow: 0 2px 12px rgba(200,100,100,0.12);
    transition: background 0.2s, box-shadow 0.2s, opacity 0.3s;
    opacity: 0.55;
  }
  #edit-toggle:hover { opacity: 1; background: rgba(255,240,235,0.92); box-shadow: 0 4px 20px rgba(200,100,100,0.22); }
  #edit-toggle svg { width: 100%; height: 100%; }

  #edit-panel {
    position: fixed; top: 58px; left: 12px;
    z-index: 200;
    width: min(320px, calc(100vw - 24px));
    background: rgba(255,248,244,0.96);
    backdrop-filter: blur(16px);
    border: 1.5px solid rgba(220,160,150,0.3);
    border-radius: 18px;
    padding: 18px 16px 14px;
    box-shadow: 0 8px 40px rgba(180,80,80,0.14);
    display: none;
    flex-direction: column;
    gap: 14px;
  }
  #edit-panel.open { display: flex; }

  .edit-title {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 15px;
    color: #a05050;
    text-align: center;
    letter-spacing: 0.06em;
    margin: 0 0 2px;
  }

  .edit-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .edit-slot {
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    cursor: pointer;
  }
  .edit-slot--final {
    grid-column: 1 / -1;
    flex-direction: row;
    align-items: center;
    gap: 10px;
    background: rgba(255,235,228,0.5);
    border-radius: 10px;
    padding: 6px 10px;
  }
  .edit-slot--final .slot-preview { width: 52px; height: 52px; flex-shrink: 0; }
  .edit-slot--final .slot-label { flex: 1; font-size: 11px; }

  .slot-label {
    font-family: 'Lato', sans-serif;
    font-size: 10px;
    font-weight: 300;
    letter-spacing: 0.1em;
    color: #b07070;
    text-transform: uppercase;
  }

  .slot-preview {
    width: 72px; height: 72px;
    border-radius: 10px;
    border: 1.5px dashed rgba(200,130,120,0.45);
    background: rgba(255,235,228,0.6);
    overflow: hidden;
    position: relative;
    display: flex; align-items: center; justify-content: center;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .slot-preview::before {
    content: '+';
    font-size: 20px;
    color: rgba(180,100,100,0.4);
    position: absolute;
  }
  .slot-preview img {
    width: 100%; height: 100%; object-fit: cover;
    position: relative; z-index: 1;
  }
  .edit-slot:hover .slot-preview {
    border-color: rgba(200,100,100,0.7);
    box-shadow: 0 0 0 3px rgba(220,130,130,0.15);
  }
  .edit-slot input[type="file"] { display: none; }

  #edit-close {
    align-self: center;
    font-family: 'Cormorant Garamond', serif;
    font-size: 13px;
    font-style: italic;
    color: #c07070;
    background: none;
    border: 1px solid rgba(200,130,130,0.35);
    border-radius: 20px;
    padding: 5px 20px;
    cursor: pointer;
    letter-spacing: 0.08em;
    transition: background 0.2s, color 0.2s;
  }
  #edit-close:hover { background: rgba(220,150,150,0.12); color: #a04040; }
  /* ── End Photo Replace Panel ─────────────────────────── */
</style>
</head>
<body>

<div id="canvas-bg"></div>
<canvas id="particle-canvas"></canvas>

<!-- Webcam & hand tracking -->
<video id="webcam" autoplay playsinline muted></video>
<canvas id="hand-canvas"></canvas>

<!-- Pinch indicator -->
<div id="pinch-indicator"></div>

<!-- Camera status -->
<div id="camera-status">✦ Allow camera to begin ✦</div>

<!-- Intro text -->
<div id="intro-text">
  <p class="tagline">For the woman<br>who made love feel safe.</p>
</div>

<!-- Instruction -->
<div id="instruction" style="opacity:0">Pinch to open each heart ✦</div>

<!-- Progress -->
<div id="progress-dots" style="opacity:0">
  <div class="progress-dot"></div>
  <div class="progress-dot"></div>
  <div class="progress-dot"></div>
  <div class="progress-dot"></div>
  <div class="progress-dot"></div>
</div>

<!-- Hearts -->
<div id="hearts-container"></div>

<!-- ── Photo Replace Panel ─────────────────────────────── -->
<button id="edit-toggle" title="Replace photos" aria-label="Replace photos">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
  </svg>
</button>

<div id="edit-panel">
  <p class="edit-title">Replace Photos</p>
  <div class="edit-grid">
    <label class="edit-slot" data-slot="0">
      <span class="slot-label">Memory 1</span>
      <div class="slot-preview" id="prev-0"></div>
      <input type="file" accept="image/*" data-slot="0">
    </label>
    <label class="edit-slot" data-slot="1">
      <span class="slot-label">Memory 2</span>
      <div class="slot-preview" id="prev-1"></div>
      <input type="file" accept="image/*" data-slot="1">
    </label>
    <label class="edit-slot" data-slot="2">
      <span class="slot-label">Memory 3</span>
      <div class="slot-preview" id="prev-2"></div>
      <input type="file" accept="image/*" data-slot="2">
    </label>
    <label class="edit-slot" data-slot="3">
      <span class="slot-label">Memory 4</span>
      <div class="slot-preview" id="prev-3"></div>
      <input type="file" accept="image/*" data-slot="3">
    </label>
    <label class="edit-slot" data-slot="4">
      <span class="slot-label">Memory 5</span>
      <div class="slot-preview" id="prev-4"></div>
      <input type="file" accept="image/*" data-slot="4">
    </label>
    <label class="edit-slot edit-slot--final" data-slot="final">
      <span class="slot-label">Final Photo</span>
      <div class="slot-preview" id="prev-final"></div>
      <input type="file" accept="image/*" data-slot="final">
    </label>
  </div>
  <button id="edit-close">✦ Done</button>
</div>
<!-- ── End Photo Replace Panel ────────────────────────── -->

<!-- Final reveal -->
<div id="final-reveal">
  <div id="final-photo-container">
    <img id="final-photo" src="" alt="Us together">
  </div>
  <div id="final-text">
    <p class="subtitle">My first home.<br>My forever heart.</p>
    <p class="main-wish">Happy Mother's Day ❤️</p>
  </div>
</div>

<!-- MediaPipe -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

// ============================================================
// PARTICLE SYSTEM
// ============================================================
const pCanvas = document.getElementById('particle-canvas');
const pCtx = pCanvas.getContext('2d');
let particles = [];
let petals = [];
let sparkles = [];

function resizeCanvas() {
  pCanvas.width = window.innerWidth;
  pCanvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// Ambient floating particles
function initParticles() {
  particles = [];
  for (let i = 0; i < 60; i++) {
    particles.push({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      size: Math.random() * 4 + 1,
      speedX: (Math.random() - 0.5) * 0.4,
      speedY: -Math.random() * 0.5 - 0.2,
      alpha: Math.random() * 0.5 + 0.1,
      color: `hsl(${Math.random() * 30 + 340}, 70%, ${Math.random() * 20 + 70}%)`,
    });
  }
}
initParticles();

// Burst particles on heart open
function burstParticles(x, y) {
  for (let i = 0; i < 60; i++) {
    const angle = (Math.random() * Math.PI * 2);
    const speed = Math.random() * 8 + 2;
    sparkles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size: Math.random() * 6 + 2,
      alpha: 1,
      color: `hsl(${Math.random() * 40 + 330}, 80%, ${Math.random() * 20 + 65}%)`,
      life: 1
    });
  }
  // Petals burst
  for (let i = 0; i < 20; i++) {
    const angle = (Math.random() * Math.PI * 2);
    const speed = Math.random() * 5 + 1;
    petals.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 2,
      rotation: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.2,
      size: Math.random() * 14 + 8,
      alpha: 1,
      life: 1,
      color: `hsl(${Math.random() * 30 + 340}, 60%, ${Math.random() * 20 + 70}%)`
    });
  }
}

function drawPetal(ctx, petal) {
  ctx.save();
  ctx.translate(petal.x, petal.y);
  ctx.rotate(petal.rotation);
  ctx.globalAlpha = petal.alpha * petal.life;
  ctx.fillStyle = petal.color;
  ctx.beginPath();
  ctx.ellipse(0, 0, petal.size * 0.4, petal.size, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// Rising hearts for final reveal
let risingHearts = [];
function createRisingHearts() {
  for (let i = 0; i < 15; i++) {
    setTimeout(() => {
      risingHearts.push({
        x: Math.random() * window.innerWidth,
        y: window.innerHeight + 50,
        size: Math.random() * 30 + 15,
        speed: Math.random() * 2 + 1,
        alpha: Math.random() * 0.6 + 0.2,
        sway: Math.random() * 2 - 1,
        t: 0
      });
    }, i * 200);
  }
}

function drawHeart(ctx, x, y, size, color, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x, y + size * 0.25);
  ctx.bezierCurveTo(x, y, x - size * 0.5, y, x - size * 0.5, y + size * 0.25);
  ctx.bezierCurveTo(x - size * 0.5, y + size * 0.55, x, y + size * 0.8, x, y + size);
  ctx.bezierCurveTo(x, y + size * 0.8, x + size * 0.5, y + size * 0.55, x + size * 0.5, y + size * 0.25);
  ctx.bezierCurveTo(x + size * 0.5, y, x, y, x, y + size * 0.25);
  ctx.fill();
  ctx.restore();
}

function animateParticles() {
  pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);

  // Ambient particles
  particles.forEach(p => {
    p.x += p.speedX;
    p.y += p.speedY;
    if (p.y < -10) p.y = pCanvas.height + 10;
    if (p.x < -10) p.x = pCanvas.width + 10;
    if (p.x > pCanvas.width + 10) p.x = -10;
    pCtx.beginPath();
    pCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    pCtx.fillStyle = p.color;
    pCtx.globalAlpha = p.alpha;
    pCtx.fill();
  });

  // Sparkles
  sparkles = sparkles.filter(s => s.life > 0.01);
  sparkles.forEach(s => {
    s.x += s.vx;
    s.y += s.vy;
    s.vy += 0.15;
    s.vx *= 0.98;
    s.life -= 0.02;
    s.alpha = s.life;
    pCtx.beginPath();
    pCtx.arc(s.x, s.y, s.size * s.life, 0, Math.PI * 2);
    pCtx.fillStyle = s.color;
    pCtx.globalAlpha = s.alpha;
    pCtx.fill();
  });

  // Petals
  petals = petals.filter(p => p.life > 0.01);
  petals.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.08;
    p.vx *= 0.99;
    p.rotation += p.rotSpeed;
    p.life -= 0.012;
    drawPetal(pCtx, p);
  });

  // Rising hearts
  risingHearts = risingHearts.filter(h => h.y > -100);
  risingHearts.forEach(h => {
    h.y -= h.speed;
    h.t += 0.02;
    h.x += Math.sin(h.t) * h.sway;
    drawHeart(pCtx, h.x, h.y, h.size, `hsl(350, 70%, 75%)`, h.alpha * 0.6);
  });

  pCtx.globalAlpha = 1;
  requestAnimationFrame(animateParticles);
}
animateParticles();

// ============================================================
// MEDIAPIPE HAND TRACKING — FIXED INTERACTION SYSTEM
// ============================================================
const videoEl = document.getElementById('webcam');
const handCanvas = document.getElementById('hand-canvas');
const handCtx = handCanvas.getContext('2d');
// pinch-indicator element kept in DOM but replaced by cursorEl below

handCanvas.width = 140;
handCanvas.height = 105;

// --- Tuning constants ---
const PINCH_THRESHOLD   = 0.10;  // normalized distance; larger = easier to trigger
const PINCH_HOLD_FRAMES = 6;     // consecutive frames needed before firing
const COLLISION_RADIUS  = 120;   // px — generous hit area around each heart centre
const COOLDOWN_MS       = 1200;  // ms between consecutive heart opens

// --- State (per-hand, indexed 0 and 1) ---
const LERP = 0.25;
let lastOpenTime = 0; // shared cooldown — prevents double-fire across both hands

// Per-hand state: smoothed cursor position + pinch frame counter
const handState = [
  { cursorX: -300, cursorY: -300, pinchFrames: 0 },
  { cursorX: -300, cursorY: -300, pinchFrames: 0 },
];

// ── Build TWO cursor + ring pairs (one per hand) ─────────────────────────
function makeCursorPair(tint) {
  const dot = document.createElement('div');
  dot.style.cssText = `
    position:fixed; pointer-events:none; z-index:999;
    width:28px; height:28px; border-radius:50%;
    transform:translate(-50%,-50%);
    background: radial-gradient(circle, ${tint.dot0} 0%, ${tint.dot1} 50%, transparent 70%);
    box-shadow: 0 0 16px 6px ${tint.shadow};
    transition: background 0.15s, box-shadow 0.15s, width 0.15s, height 0.15s;
    display:none;
  `;
  document.body.appendChild(dot);

  const ring = document.createElement('div');
  ring.style.cssText = `
    position:fixed; pointer-events:none; z-index:998;
    width:56px; height:56px; border-radius:50%;
    transform:translate(-50%,-50%);
    border:2.5px solid ${tint.ring};
    box-shadow: 0 0 20px 4px ${tint.ringGlow};
    transition:opacity 0.2s;
    opacity:0;
  `;
  document.body.appendChild(ring);

  return { dot, ring, tint };
}

const cursors = [
  makeCursorPair({ // Hand 0 — rose pink
    dot0:'rgba(255,180,180,1)', dot1:'rgba(232,100,100,0.6)', shadow:'rgba(232,120,120,0.5)',
    ring:'rgba(220,80,80,0.85)', ringGlow:'rgba(220,80,80,0.35)',
    pinchDot0:'rgba(255,120,120,1)', pinchDot1:'rgba(200,60,60,0.7)', pinchShadow:'rgba(220,60,60,0.65)',
  }),
  makeCursorPair({ // Hand 1 — warm peach (distinct but same palette)
    dot0:'rgba(255,200,170,1)', dot1:'rgba(220,130,80,0.6)', shadow:'rgba(220,150,100,0.5)',
    ring:'rgba(210,120,60,0.85)', ringGlow:'rgba(210,120,60,0.35)',
    pinchDot0:'rgba(255,160,100,1)', pinchDot1:'rgba(190,90,40,0.7)', pinchShadow:'rgba(200,100,50,0.65)',
  }),
];

function setCursorPinching(ci, on) {
  const { dot, ring, tint } = cursors[ci];
  if (on) {
    dot.style.background  = `radial-gradient(circle, ${tint.pinchDot0} 0%, ${tint.pinchDot1} 50%, transparent 70%)`;
    dot.style.boxShadow   = `0 0 28px 10px ${tint.pinchShadow}`;
    dot.style.width       = '22px';
    dot.style.height      = '22px';
    ring.style.opacity    = '1';
  } else {
    dot.style.background  = `radial-gradient(circle, ${tint.dot0} 0%, ${tint.dot1} 50%, transparent 70%)`;
    dot.style.boxShadow   = `0 0 16px 6px ${tint.shadow}`;
    dot.style.width       = '28px';
    dot.style.height      = '28px';
    ring.style.opacity    = '0';
  }
}

function moveCursor(ci, x, y) {
  const { dot, ring } = cursors[ci];
  dot.style.left  = x + 'px';  dot.style.top  = y + 'px';
  ring.style.left = x + 'px';  ring.style.top = y + 'px';
}

// ── Bone connections for skeleton draw ──────────────────────────────────
const BONES = [
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],
  [13,17],[17,18],[18,19],[19,20],[0,17]
];

// ── Process a single hand's landmarks ───────────────────────────────────
function processHand(landmarks, handIdx, isPinchingGlobal_out) {
  const hs    = handState[handIdx];
  const thumb = landmarks[4];
  const index = landmarks[8];

  // Smooth cursor (index fingertip, mirrored x)
  hs.cursorX += ((1 - index.x) * window.innerWidth  - hs.cursorX) * LERP;
  hs.cursorY += (index.y       * window.innerHeight  - hs.cursorY) * LERP;

  // Show cursor
  cursors[handIdx].dot.style.display = 'block';
  moveCursor(handIdx, hs.cursorX, hs.cursorY);

  // Pinch: normalised + absolute
  const wrist   = landmarks[0];
  const midMcp  = landmarks[9];
  const span    = Math.hypot(midMcp.x - wrist.x, midMcp.y - wrist.y) || 0.2;
  const absDist = Math.hypot(thumb.x - index.x, thumb.y - index.y);
  const norm    = absDist / span;
  const isPinching = (norm < 0.32) || (absDist < PINCH_THRESHOLD);

  // Pinch midpoint (mirrored)
  const pmx = (1 - (thumb.x + index.x) * 0.5) * window.innerWidth;
  const pmy = (thumb.y + index.y) * 0.5 * window.innerHeight;

  setCursorPinching(handIdx, isPinching);

  // Highlight hearts near this cursor
  heartEls.forEach(h => {
    if (!h.el || h.opened) return;
    const rect = h.el.getBoundingClientRect();
    const hcx  = rect.left + rect.width  * 0.5;
    const hcy  = rect.top  + rect.height * 0.5;
    if (Math.hypot(hs.cursorX - hcx, hs.cursorY - hcy) < COLLISION_RADIUS * 1.2) {
      h.el.classList.add('pinching');
    }
  });

  // Pinch hold logic
  if (isPinching) {
    hs.pinchFrames++;
    if (hs.pinchFrames >= PINCH_HOLD_FRAMES) {
      const now = Date.now();
      if (now - lastOpenTime > COOLDOWN_MS) {
        for (const h of heartEls) {
          if (!h.el || h.opened) continue;
          const rect = h.el.getBoundingClientRect();
          const hcx  = rect.left + rect.width  * 0.5;
          const hcy  = rect.top  + rect.height * 0.5;
          const dC   = Math.hypot(hs.cursorX - hcx, hs.cursorY - hcy);
          const dP   = Math.hypot(pmx - hcx, pmy - hcy);
          if (dC < COLLISION_RADIUS || dP < COLLISION_RADIUS) {
            openHeart(h);
            lastOpenTime   = now;
            hs.pinchFrames = 0;
            break;
          }
        }
      }
    }
  } else {
    hs.pinchFrames = 0;
  }

  // Draw skeleton on mini canvas
  const strokeColor = isPinching ? 'rgba(220,80,80,0.8)' : 'rgba(232,160,160,0.6)';
  handCtx.strokeStyle = strokeColor;
  handCtx.lineWidth   = 1;
  BONES.forEach(([a, b]) => {
    const la = landmarks[a], lb = landmarks[b];
    handCtx.beginPath();
    handCtx.moveTo((1 - la.x) * handCanvas.width, la.y * handCanvas.height);
    handCtx.lineTo((1 - lb.x) * handCanvas.width, lb.y * handCanvas.height);
    handCtx.stroke();
  });
  handCtx.fillStyle = 'rgba(200,100,100,0.9)';
  [4, 8].forEach(i => {
    const lm = landmarks[i];
    handCtx.beginPath();
    handCtx.arc((1 - lm.x) * handCanvas.width, lm.y * handCanvas.height, 3, 0, Math.PI * 2);
    handCtx.fill();
  });
  handCtx.fillStyle = 'rgba(232,160,160,0.6)';
  landmarks.forEach((lm, i) => {
    if (i === 4 || i === 8) return;
    handCtx.beginPath();
    handCtx.arc((1 - lm.x) * handCanvas.width, lm.y * handCanvas.height, 1.5, 0, Math.PI * 2);
    handCtx.fill();
  });
}

function onResults(results) {
  handCtx.clearRect(0, 0, handCanvas.width, handCanvas.height);

  // Track which hand indices are active this frame
  const activeCount = results.multiHandLandmarks ? results.multiHandLandmarks.length : 0;

  // Reset highlight on all hearts each frame (re-set below per-hand)
  heartEls.forEach(h => { if (h.el) h.el.classList.remove('pinching'); });

  if (activeCount === 0) {
    // No hands — hide both cursors, reset frames
    cursors.forEach((c, i) => {
      c.dot.style.display = 'none';
      c.ring.style.opacity = '0';
      handState[i].pinchFrames = 0;
    });
    return;
  }

  // Process up to 2 hands
  for (let i = 0; i < Math.min(activeCount, 2); i++) {
    processHand(results.multiHandLandmarks[i], i);
  }

  // Hide cursor for any hand slot not active this frame
  for (let i = activeCount; i < 2; i++) {
    cursors[i].dot.style.display = 'none';
    cursors[i].ring.style.opacity = '0';
    handState[i].pinchFrames = 0;
  }
}

const hands = new Hands({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
  maxNumHands: 2,          // ← both hands now tracked
  modelComplexity: 1,
  minDetectionConfidence: 0.65,
  minTrackingConfidence:  0.55
});

hands.onResults(onResults);

const camera = new Camera(videoEl, {
  onFrame: async () => {
    await hands.send({ image: videoEl });
  },
  width: 320, height: 240   // slightly higher res for better tracking
});

camera.start().then(() => {
  document.getElementById('camera-status').textContent = '✦ Camera active — pinch over a heart ✦';
  setTimeout(() => {
    document.getElementById('camera-status').style.opacity = '0';
  }, 4000);
}).catch(() => {
  document.getElementById('camera-status').textContent = '⚠ Camera access needed — please allow and reload';
});

(function () {
  const toggle   = document.getElementById('edit-toggle');
  const panel    = document.getElementById('edit-panel');
  const closeBtn = document.getElementById('edit-close');

  // Open / close panel
  toggle.addEventListener('click', () => panel.classList.toggle('open'));
  closeBtn.addEventListener('click', () => panel.classList.remove('open'));

  // Pre-fill previews with the currently embedded images
  function seedPreview(slotId, src) {
    const container = document.getElementById('prev-' + slotId);
    if (!container) return;
    const img = document.createElement('img');
    img.src = src;
    container.appendChild(img);
  }
  IMAGES.memories.forEach((src, i) => seedPreview(i, src));
  seedPreview('final', IMAGES.final);

  // Handle file selection for any slot
  panel.querySelectorAll('input[type="file"]').forEach(input => {
    input.addEventListener('change', function () {
      const file = this.files[0];
      if (!file) return;
      const slot = this.dataset.slot;          // "0"–"4" or "final"
      const reader = new FileReader();

      reader.onload = function (e) {
        const dataURL = e.target.result;

        // 1 ── Update the IMAGES runtime object
        if (slot === 'final') {
          IMAGES.final = dataURL;
          // Also update the final reveal <img> if it's already shown
          const finalImg = document.getElementById('final-photo');
          if (finalImg) finalImg.src = dataURL;
        } else {
          const idx = parseInt(slot, 10);
          IMAGES.memories[idx] = dataURL;
        }

        // 2 ── Update the small preview thumbnail inside the panel
        const container = document.getElementById('prev-' + slot);
        let thumb = container.querySelector('img');
        if (!thumb) { thumb = document.createElement('img'); container.appendChild(thumb); }
        thumb.src = dataURL;

        // 3 ── If the memory photo is already visible on screen, swap its src live
        if (slot !== 'final') {
          const idx = parseInt(slot, 10);
          const livePhoto = document.querySelector(`.memory-photo:nth-of-type(${idx + 1}) img`);
          if (livePhoto) livePhoto.src = dataURL;
          // More robust: find by index stored in data attribute
          document.querySelectorAll('.memory-photo').forEach(el => {
            if (parseInt(el.dataset.memIdx, 10) === idx) {
              const img = el.querySelector('img');
              if (img) img.src = dataURL;
            }
          });
        }
      };

      reader.readAsDataURL(file);
    });
  });
})();

// Ambient glow pulse on background

  const bg = document.getElementById('canvas-bg');
  const shift = Math.sin(Date.now() * 0.0005) * 5;
  bg.style.background = `radial-gradient(ellipse at ${30 + shift}% ${20 + shift * 0.5}%, #fde8d8 0%, #f7c5c5 30%, #fce4e4 60%, #fff0f5 100%)`;
}, 50);

</script>
</body>
